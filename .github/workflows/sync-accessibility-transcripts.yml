name: Synchronize accessibility interview document
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_accessibility_transcripts.py'
      - 'interview-transcript.txt'
      - 'interview-02-transcript.txt'
      - '.github/workflows/sync-accessibility-transcripts.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DOCX support
        run: python -m pip install python-docx
      - name: Update first two interviews in current document
        run: python scripts/sync_accessibility_transcripts.py
      - name: Commit accessibility document
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Interview_Transcripts_Accessibility.docx
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize accessibility document interviews 01–02"
            git pull --rebase origin main
            git push origin main
          fi
